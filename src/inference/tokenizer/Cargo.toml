# Native tokenization/hash ABI used only by the C++ inference component.
# Pin the tokenizer engine to offline export tooling; no model or network at initialization.
[package]
name = "regulagraph-inference-tokenizer"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
path = "lib.rs"
crate-type = ["staticlib"]

[dependencies]
tokenizers = { version = "=0.21.4", default-features = false, features = ["fancy-regex"] }
sha2 = "=0.10.9"
