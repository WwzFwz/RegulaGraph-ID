# Metadata crate Rust untuk transformasi batch ingestion dan knowledge graph.
# Integrasi: library menyediakan module tree, generated protobuf dan validator C01; transport worker belum aktif.
# Performa: belum ada dependency model/parser atau executable worker yang aktif.
[package]
name = "regulagraph-ingestion"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
protobuf = "=3.7.2"

[build-dependencies]
protobuf-codegen = "=3.7.2"
