# Metadata crate Rust untuk transformasi batch ingestion dan knowledge graph.
# Integrasi: library menyediakan validator rust-protobuf dan transport Tonic yang dihasilkan dari schema C01 yang sama.
# Performa: executable worker memuat PDFium sekali, membatasi concurrency/message, dan mengirim referensi artefak.
[package]
name = "regulagraph-ingestion"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# pdfium-render menerima libloading 0.x; pin ini mempertahankan kompatibilitas MSRV Rust 1.87.
libloading = "=0.8.9"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_6406", "thread_safe"] }
prost = "=0.13.5"
prost-types = "=0.13.5"
protobuf = "=3.7.2"
sha2 = "=0.10.9"
serde = "=1.0.229"
serde_json = "=1.0.151"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tonic = "=0.13.1"
tokenizers = { version = "=0.21.4", default-features = false, features = ["fancy-regex"] }
# Tabel NFC Unicode 15.0 cocok dengan x/text pada Go 1.26; tes analyzer mengunci versi.
unicode-normalization = "=0.1.22"

[build-dependencies]
protoc-bin-vendored = "=3.2.0"
protobuf-codegen = "=3.7.2"
tonic-build = "=0.13.1"

[dev-dependencies]
ahash = "=0.8.12"
