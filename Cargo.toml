# Workspace Rust untuk komponen pemrosesan native RegulaGraph-ID.
# Peran: menyatukan crate worker dan konfigurasi build yang dapat direproduksi.
# Integrasi: target build/benchmark berada di .cache; worker Rust memakai Tonic gRPC dari schema C01.
[workspace]
members = ["src/ingestion"]
resolver = "2"
